<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="dark">
  <meta name="htmx-config" content='{"allowEval":false,"includeIndicatorStyles":false,"allowScriptTags":false}'>
  <title>{% block title %}Time capsules{% endblock %} · Again, here</title>
  <link rel="stylesheet" href="/static/style.css">
  <script src="/static/htmx.min.js" defer></script>
  <script src="/static/app.js" defer></script>
</head>
<body>
  <header class="site-header">
    <a class="wordmark" href="/">Again, here<span class="wordmark-mark" aria-hidden="true">.</span></a>
    <nav class="header-actions" aria-label="Workspace"><a class="text-link" href="/">Your visits</a><a class="text-link" href="/capsules">Time capsules</a></nav>
  </header>
  <main class="workspace">{% block content %}{% endblock %}</main>
  <footer class="site-footer"><span>Your words stay yours.</span><span>Saved in this browser’s workspace. Keep its cookies to return.</span></footer>
</body>
</html>
