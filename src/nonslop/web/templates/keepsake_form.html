<form action="/capsules" method="post" enctype="multipart/form-data" class="form-stack"
      hx-post="/capsules" hx-encoding="multipart/form-data" hx-swap="none" hx-disabled-elt="find button">
  <input type="hidden" name="csrf" value="{{ csrf }}">
  <div class="field">
    <label for="capsule-title">Keepsake name</label>
    <input id="capsule-title" name="title" type="text" maxlength="120" required>
  </div>
  <div class="field">
    <label for="capsule-description">Why does it matter to you? <span class="optional">Optional</span></label>
    <textarea id="capsule-description" name="description" rows="4" maxlength="4000" placeholder="Begin in your own words."></textarea>
  </div>
  <div class="field">
    <label for="capsule-anchor">Photograph of the keepsake <span class="optional">Optional</span></label>
    <input id="capsule-anchor" name="anchor" type="file" accept="image/png,image/jpeg,image/webp" aria-describedby="ks-anchor-help">
    <p class="field-help" id="ks-anchor-help">JPEG, PNG or WebP.</p>
  </div>
  <button class="button button-primary" type="submit">Create a keepsake</button>
</form>
